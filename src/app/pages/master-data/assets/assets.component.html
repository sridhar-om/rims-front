<div class="container-fluid">

  <div class="row">

    <div class="col-12">


      <div class="app-table-container">


        <!-- =====================================
             PAGE ACTIONS
        ====================================== -->

        <div class="app-page-actions">


          <!-- Filter -->

          <button
            type="button"
            class="app-btn app-btn-filter"
            (click)="toggleFilter()">

            <mat-icon>
              filter_list
            </mat-icon>

            <span>
              Filter
            </span>

          </button>


          <!-- Add -->

          <button
            type="button"
            class="app-btn app-btn-primary"
            (click)="onAdd()">

            <mat-icon>
              add
            </mat-icon>

            <span>
              Add Asset
            </span>

          </button>


        </div>

@if (showFilter) {

  <mat-card class="app-filter-panel">

    <mat-card-content>

      <div class="app-filter-grid">


        <!-- =================================
             KEYWORD
        ================================== -->

        <div class="app-filter-field">

          <label for="assetKeyword">
            Keyword:
          </label>

          <mat-form-field
            appearance="outline"
            class="app-filter-control">

            <input
              matInput
              id="assetKeyword"
              [(ngModel)]="keyword"
              placeholder="Search Asset">

          </mat-form-field>

        </div>


        <!-- =================================
             STATUS
        ================================== -->

        <div class="app-filter-field">

          <label for="assetStatus">
            Status:
          </label>

          <mat-form-field
            appearance="outline"
            class="app-filter-control">

            <mat-select
              id="assetStatus"
              [(ngModel)]="status"
              placeholder="Select Status">


              <mat-option value="Active">
                Active
              </mat-option>

              <mat-option value="Inactive">
                Inactive
              </mat-option>

            </mat-select>

          </mat-form-field>

        </div>


        <!-- =================================
             SEARCH
        ================================== -->

        <button
          type="button"
          class="app-btn app-btn-primary"
          (click)="onSearch()">

          <mat-icon>
            search
          </mat-icon>

          <span>
            Search
          </span>

        </button>


        <!-- =================================
             CLEAR
        ================================== -->

        <button
          type="button"
          class="app-btn app-btn-default"
          (click)="onClear()">

          <mat-icon>
            settings_backup_restore
          </mat-icon>

          <span>
            Clear
          </span>

        </button>


        <!-- =================================
             COLLAPSE
        ================================== -->

        <button
          type="button"
          class="app-icon-btn"
          aria-label="Collapse filter"
          (click)="toggleFilter()">

          <mat-icon>
            keyboard_double_arrow_up
          </mat-icon>

        </button>


      </div>

    </mat-card-content>

  </mat-card>

}

        <!-- =====================================
             TABLE
        ====================================== -->

        <div class="table-responsive">

          <table class="table app-table">


            <thead>

              <tr>

                <th class="text-center">
                  Actions
                </th>

                <th class="text-center">
                  Status
                </th>

                <th class="text-center">
                  Asset Name
                </th>

                <th class="text-center">
                  Asset Code
                </th>

              </tr>

            </thead>


            <tbody>


              @for (asset of paginatedAssets; track asset.code) {

                <tr>


                  <!-- Actions -->

                  <td class="text-center">

                    <div class="table-actions">


                      <button
                        type="button"
                        class="table-action-button edit"
                        matTooltip="Edit"
                        aria-label="Edit asset"
                        (click)="onEdit(asset)">

                        <mat-icon>
                          edit
                        </mat-icon>

                      </button>


                      <button
                        type="button"
                        class="table-action-button delete"
                        matTooltip="Delete"
                        aria-label="Delete asset"
                        (click)="onDelete(asset)">

                        <mat-icon>
                          delete
                        </mat-icon>

                      </button>


                    </div>

                  </td>


                  <!-- Status -->

                  <td class="text-center">

                    <button
                      type="button"
                      class="status-button"
                      [class.status-active]="asset.status === 'Active'"
                      [class.status-inactive]="asset.status === 'Inactive'"
                      (click)="onStatusChange(asset)">

                      {{ asset.status }}

                    </button>

                  </td>


                  <!-- Asset Name -->

                  <td class="text-center">

                    {{ asset.name }}

                  </td>


                  <!-- Asset Code -->

                  <td class="text-center">

                    {{ asset.code }}

                  </td>


                </tr>

              } @empty {

                <tr>

                  <td
                    colspan="4"
                    class="empty-table">

                    No records found

                  </td>

                </tr>

              }


            </tbody>


          </table>

        </div>


        <!-- =====================================
             PAGINATION
        ====================================== -->

        <mat-paginator
          [length]="filteredAssets.length"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 20, 50, 100]"
          [showFirstLastButtons]="true"
          (page)="handlePage($event)">

        </mat-paginator>


      </div>

    </div>

  </div>

</div>
